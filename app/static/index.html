<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF RAG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f9fa;
    --surface: #fff;
    --border: #e0e2e6;
    --text: #1a1d23;
    --text-secondary: #6b6f76;
    --text-tertiary: #9ca0a7;
    --primary: #1a1d23;
    --primary-hover: #2c3038;
    --accent: #2563eb;
    --accent-light: #e8effd;
    --success: #16a34a;
    --danger: #dc2626;
    --radius: 8px;
    --radius-sm: 4px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    --transition: 150ms ease;
  }
  html { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100%;
    display: flex;
    flex-direction: column;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a, button, input, [tabindex] { outline-offset: 2px; }
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
    min-height: 52px;
  }
  .logo { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .logo span { color: var(--text-secondary); font-weight: 400; margin-left: 6px; }
  .logo small { font-size: 11px; color: var(--text-tertiary); font-weight: 400; margin-left: 8px; }
  .spacer { flex: 1; }
  .hdr-btn {
    background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px 12px; font-size: 13px; font-family: var(--font); color: var(--text-secondary);
    cursor: pointer; transition: background var(--transition), color var(--transition);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .hdr-btn:hover { background: var(--bg); color: var(--text); }
  .hdr-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Layout */
  .layout { max-width: 1100px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: row; gap: 16px; padding: 0 16px; min-height: 0; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* Docs sidebar */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin: 12px 0; display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
  .sidebar-add {
    width: 26px; height: 26px; border-radius: 7px; border: none; background: var(--bg);
    color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .sidebar-add:hover { background: var(--accent-light); color: var(--accent); }
  .sidebar-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .doc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; transition: background var(--transition); }
  .doc-item:hover { background: var(--bg); }
  .doc-item .doc-icon { color: var(--text-tertiary); font-size: 13px; flex-shrink: 0; }
  .doc-item .doc-meta { min-width: 0; flex: 1; }
  .doc-item .doc-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-item .doc-sub { font-size: 11px; color: var(--text-tertiary); }
  .doc-item .doc-del {
    background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 14px;
    padding: 2px 5px; border-radius: 5px; opacity: 0; transition: opacity var(--transition), color var(--transition), background var(--transition); line-height: 1; flex-shrink: 0;
  }
  .doc-item:hover .doc-del { opacity: 1; }
  .doc-del:hover { color: var(--danger); background: #fef2f2; }
  .sidebar .empty-state { padding: 24px 14px; text-align: center; color: var(--text-tertiary); font-size: 12px; line-height: 1.5; }

  /* Chat */
  .chat { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }

  /* Messages */
  .msg { padding: 12px 16px; border-radius: var(--radius); max-width: 92%; line-height: 1.6; font-size: 14px; animation: fadeIn .2s ease; word-wrap: break-word; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .user { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: var(--radius-sm); }
  .assistant { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: var(--radius-sm); max-width: 720px; box-shadow: var(--shadow); }

  /* Markdown inside assistant messages */
  .assistant h1, .assistant h2, .assistant h3 { margin: 12px 0 6px; font-weight: 600; line-height: 1.3; }
  .assistant h1 { font-size: 16px; }
  .assistant h2 { font-size: 15px; }
  .assistant h3 { font-size: 14px; }
  .assistant p { margin: 6px 0; }
  .assistant ul, .assistant ol { margin: 6px 0; padding-left: 20px; }
  .assistant li { margin: 2px 0; }
  .assistant code { background: #f0f1f3; padding: 1px 4px; border-radius: 3px; font-family: var(--mono); font-size: 13px; }
  .assistant pre { background: #f0f1f3; padding: 10px 14px; border-radius: var(--radius-sm); overflow-x: auto; margin: 8px 0; }
  .assistant pre code { background: none; padding: 0; font-size: 12px; }
  .assistant table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
  .assistant th, .assistant td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .assistant th { background: #f8f9fa; font-weight: 600; }
  .assistant blockquote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0; color: var(--text-secondary); }

  /* Citation links */
  .citation { color: var(--accent); cursor: pointer; font-weight: 600; font-size: 12px; vertical-align: super; line-height: 0; text-decoration: none; }
  .citation:hover { text-decoration: underline; }

  /* Source cards */
  .src-cards { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
  .src-card {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-light); border: 1px solid #d0d9f0;
    padding: 6px 10px; border-radius: var(--radius-sm); font-size: 12px;
    cursor: pointer; transition: background var(--transition), box-shadow var(--transition);
    animation: fadeIn .25s ease;
  }
  .src-card:hover { background: #d4def5; box-shadow: var(--shadow); }
  .src-card .num { font-weight: 700; color: var(--accent); }
  .src-card .fname { color: var(--text); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-card .page { color: var(--text-secondary); white-space: nowrap; }
  .src-card .score { color: var(--text-tertiary); font-size: 11px; }

  /* Status */
  .status { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: var(--text-secondary); animation: fadeIn .2s ease; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status.done { color: var(--success); }
  .status.done .spinner { border-color: var(--success); border-top-color: var(--success); animation: none; }

  /* Typing cursor */
  .typing::after { content: '\u258C'; animation: blink .8s step-end infinite; color: var(--text-secondary); }
  @keyframes blink { 50% { opacity: 0; } }

  /* Metrics (behind Details toggle) */
  .metrics-wrap { padding: 10px 0 4px; }
  .details-btn { background: none; border: 1px solid var(--border); color: var(--text-secondary); border-radius: 6px; padding: 3px 10px; font-size: 12px; font-family: var(--font); cursor: pointer; transition: background var(--transition), color var(--transition); }
  .details-btn:hover { background: var(--bg); color: var(--text); }
  .metrics { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0 4px; border-top: 1px dashed var(--border); margin-top: 8px; }
  .metrics[hidden] { display: none; }
  .metrics .chip {
    background: var(--surface); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: var(--radius-sm); font-size: 12px;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .metrics .chip .val { font-weight: 600; color: var(--text); }

  /* Word-level streaming */
  .answer-body { display: inline; }
  .w { display: inline; animation: stream-in 420ms cubic-bezier(0.22, 0.61, 0.25, 1) both; will-change: filter, opacity; }
  @keyframes stream-in { from { opacity: 0; filter: blur(6px); transform: translateY(2px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
  .cite-chip {
    display: inline-flex; align-items: center; margin: 0 1px; padding: 0 5px;
    border-radius: 4px; background: var(--accent-light); border: 1px solid #d0d9f0;
    color: var(--accent); font-size: 11px; font-weight: 600; cursor: pointer;
    vertical-align: super; line-height: 1.5;
    animation: pop-in 250ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  .cite-chip:hover { background: #d4def5; }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .stream-cursor { display: inline-block; width: 2px; height: 14px; margin-left: 2px; border-radius: 1px; background: var(--text-secondary); vertical-align: text-bottom; animation: blink .8s step-end infinite; }

  /* Answer footer: actions, sources, follow-ups */
  .answer-actions { display: flex; align-items: center; gap: 2px; padding: 10px 0 0; }
  .action-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    border: none; background: transparent; color: var(--text-secondary); border-radius: 6px;
    cursor: pointer; transition: color var(--transition), background var(--transition);
  }
  .action-btn:hover { background: var(--bg); color: var(--text); }
  .action-btn.on { color: var(--accent); }
  .sources-wrap { padding: 8px 0 0; }
  .src-toggle {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    background: var(--surface); border-radius: var(--radius); padding: 5px 10px 5px 6px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer; font-family: var(--font);
    transition: background var(--transition);
  }
  .src-toggle:hover { background: var(--bg); }
  .src-avatars { display: inline-flex; }
  .src-avatar {
    display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700;
    box-shadow: 0 0 0 1.5px var(--surface);
  }
  .src-avatar + .src-avatar { margin-left: -5px; }
  .sources-pop { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .3s cubic-bezier(0.23, 1, 0.32, 1), opacity .25s ease; }
  .sources-pop.open { grid-template-rows: 1fr; opacity: 1; }
  .sources-inner { overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
  .sources-inner .src-card { width: 100%; cursor: pointer; }
  .followups { padding: 12px 0 4px; }
  .fu-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .fu-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; border-bottom: 1px solid #f0f1f3; padding: 7px 4px;
    font-size: 13px; color: var(--text); font-family: var(--font); cursor: pointer;
    border-radius: var(--radius-sm); transition: background var(--transition);
    animation: fade-up 350ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  .fu-btn:hover { background: var(--bg); }
  .fu-btn svg { color: var(--text-tertiary); flex-shrink: 0; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Input */
  /* Composer */
  .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 8px 10px; margin: 12px 0; flex-shrink: 0; }
  .composer-main { display: flex; align-items: center; gap: 8px; }
  .composer input[type=text] { flex: 1; min-width: 0; padding: 10px 6px; border: none; outline: none; background: transparent; font-size: 14px; font-family: var(--font); color: var(--text); }
  .composer input[type=text]::placeholder { color: var(--text-tertiary); }
  .attach-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: none; border-radius: 9px; background: transparent; color: var(--text-secondary); cursor: pointer; transition: background var(--transition), color var(--transition); flex-shrink: 0; }
  .attach-btn:hover { background: var(--bg); color: var(--text); }
  .composer #send {
    width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    background: var(--primary); color: #fff; border: none; border-radius: 10px;
    font-size: 14px; font-family: var(--font); font-weight: 500; cursor: pointer; transition: background var(--transition); flex-shrink: 0;
  }
  .composer #send:hover { background: var(--primary-hover); }
  .composer #send:disabled { opacity: .4; cursor: not-allowed; }
  .composer-status { display: flex; align-items: center; gap: 8px; padding: 6px 6px 2px; font-size: 12px; color: var(--text-tertiary); }
  .composer-status[hidden] { display: none; }

  /* Upload progress (inside composer) */
  input[type=file] { display: none; }
  .progress-bar { flex: 1; max-width: 200px; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s ease; width: 0%; }
  .composer-status .ok { color: var(--success); }
  .composer-status .err { color: var(--danger); }

  /* Responsive */
  #docsBtn { display: none; }
  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    .sidebar {
      display: none; position: fixed; left: 0; top: 0; bottom: 0; width: 260px; margin: 0;
      border-radius: 0; border-right: 1px solid var(--border); box-shadow: var(--shadow); z-index: 50;
    }
    .sidebar.open { display: flex; }
    #docsBtn { display: inline-flex; }
  }
  @media (max-width: 600px) {
    header { padding: 8px 12px; }
    .layout { padding: 0 10px; }
    .msg { max-width: 98%; padding: 10px 12px; }
    .src-card .fname { max-width: 80px; }
  }

  .chat::-webkit-scrollbar, .sidebar-list::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-track, .sidebar-list::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb, .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header role="banner">
  <div class="logo">PDF RAG</div>
  <span class="spacer"></span>
  <button class="hdr-btn" id="docsBtn" onclick="toggleDocs()" aria-label="Toggle document list" aria-expanded="false">&#128203; Documents</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Indexed documents">
    <div class="sidebar-head">
      <span class="sidebar-title">Documents</span>
      <button type="button" class="sidebar-add" id="sidebarAdd" title="Upload PDFs" aria-label="Upload PDFs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <main class="main">
    <div class="chat" id="chat" role="log" aria-label="Chat messages" aria-live="polite"></div>

    <form class="composer" id="form" role="search" aria-label="Ask a question">
      <div class="composer-main">
        <button type="button" class="attach-btn" id="attachBtn" title="Upload PDFs" aria-label="Upload PDFs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input type="text" id="input" placeholder="Ask about your documents..." autofocus aria-label="Your question">
        <button type="submit" id="send" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <input type="file" id="fileInput" accept=".pdf" multiple aria-label="Select PDF files to upload">
      <div class="composer-status" id="uploadInfo" hidden>
        <span class="progress-bar" id="progressBar"><span class="fill" id="progressFill"></span></span>
        <span id="uploadText"></span>
      </div>
    </form>
  </main>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const fileInput = document.getElementById('fileInput');
const uploadText = document.getElementById('uploadText');
const progressFill = document.getElementById('progressFill');
const uploadInfo = document.getElementById('uploadInfo');
const sidebarList = document.getElementById('sidebarList');
const sidebarAdd = document.getElementById('sidebarAdd');
const sidebar = document.getElementById('sidebar');
const docsBtn = document.getElementById('docsBtn');
const attachBtn = document.getElementById('attachBtn');

attachBtn.addEventListener('click', () => fileInput.click());
sidebarAdd.addEventListener('click', () => fileInput.click());

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(cls) {
  const el = document.createElement('div');
  el.className = `msg ${cls}`;
  chat.append(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return el;
}

function addStatus(text) {
  const el = document.createElement('div');
  el.className = 'status';
  el.innerHTML = `<div class="spinner" aria-hidden="true"></div>${esc(text)}`;
  chat.append(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return el;
}

function addMetrics(data) {
  const wrap = document.createElement('div');
  wrap.className = 'metrics-wrap';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'details-btn';
  btn.textContent = 'Details';
  const chips = document.createElement('div');
  chips.className = 'metrics';
  chips.hidden = true;
  const msItems = [
    [`\u26a1`, data.latency_ms],
    [`\uD83E\uDDE0`, data.llm_ms],
    [`\uD83D\uDCDA`, data.retrieval_ms],
    [`\uD83D\uDD04`, data.rerank_ms],
  ];
  const tokItems = [
    [`\uD83D\uDCC4`, data.tokens_in, 'tok in'],
    [`\uD83D\uDCE4`, data.tokens_out, 'tok out'],
  ];
  chips.innerHTML =
    msItems.map(([emoji, ms]) =>
      `<span class="chip">${emoji} <span class="val">${(ms / 1000).toFixed(2)}s</span></span>`
    ).join('') +
    tokItems.map(([emoji, n, unit]) =>
      `<span class="chip">${emoji} <span class="val">${n}</span> ${unit}</span>`
    ).join('');
  btn.addEventListener('click', () => {
    chips.hidden = !chips.hidden;
    btn.textContent = chips.hidden ? 'Details' : 'Hide details';
  });
  wrap.append(btn, chips);
  chat.append(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function loadDocs() {
  try {
    const r = await fetch('/documents');
    const docs = await r.json();
    if (docs.length === 0) {
      sidebarList.innerHTML = '<div class="empty-state">No documents yet.<br>Upload a PDF to start asking.</div>';
      return;
    }
    sidebarList.innerHTML = docs.map(d =>
      `<div class="doc-item" title="${esc(d.filename)}">
        <span class="doc-icon">&#128196;</span>
        <span class="doc-meta">
          <div class="doc-name">${esc(d.filename)}</div>
          <div class="doc-sub">${d.chunks} chunks &middot; ${d.pages} pages</div>
        </span>
        <button class="doc-del" onclick="deleteDoc('${d.document_id}')" title="Delete document" aria-label="Delete ${esc(d.filename)}">&#10005;</button>
      </div>`
    ).join('');
  } catch {}
}

function toggleDocs() {
  const open = sidebar.classList.toggle('open');
  docsBtn.classList.toggle('active', open);
  docsBtn.setAttribute('aria-expanded', open);
  if (open) loadDocs();
}

async function deleteDoc(id) {
  if (!confirm('Permanently delete this document?')) return;
  await fetch(`/documents/${id}`, { method: 'DELETE' });
  loadDocs();
  addMsg('assistant').innerHTML = '<span style="color:var(--text-tertiary)">\u2713 Document deleted</span>';
}

// Upload with progress
fileInput.addEventListener('change', async () => {
  const files = fileInput.files;
  if (!files.length) return;

  send.disabled = true;
  uploadInfo.hidden = false;
  progressFill.style.width = '0%';
  uploadText.textContent = 'Uploading...';

  const total = files.length;
  let completed = 0;
  const allResults = [];

  for (const file of files) {
    const fd = new FormData();
    fd.append('files', file);
    try {
      const r = await fetch('/upload', { method: 'POST', body: fd });
      const results = await r.json();
      allResults.push(...results);
    } catch {}
    completed++;
    const pct = Math.round((completed / total) * 100);
    progressFill.style.width = pct + '%';
    uploadText.textContent = `${pct}% (${completed}/${total})`;
  }

  const ok = allResults.filter(x => x.chunks > 0);
  const dup = allResults.filter(x => x.chunks === 0);
  const parts = [];
  if (ok.length) parts.push(`<span class="ok">\u2713</span> ${ok.length} file(s) indexed (${ok.map(x => x.chunks).reduce((a,b)=>a+b,0)} chunks)`);
  if (dup.length) parts.push(`${dup.length} duplicate(s) skipped`);
  uploadText.innerHTML = parts.join(', ');
  progressFill.style.width = '100%';
  setTimeout(() => { progressFill.style.width = '0%'; uploadInfo.hidden = true; }, 4000);
  loadDocs();

  fileInput.value = '';
  send.disabled = false;
});

// Streaming chat with word-level reveal
let answerEl = null;
let answerBody = null;
let statusEl = null;
let markdownBuffer = '';
let pendingText = '';
let sourcesList = [];
let lastQuestion = '';

const COPY_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const RETRY_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>';
const UP_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z"/></svg>';
const DOWN_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2M9 18.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/></svg>';
const ARROW_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>';
const AVATAR_COLORS = ['#2563eb', '#16a34a', '#e56d24', '#9333ea', '#dc2626', '#0891b2', '#ca8a04', '#db2777'];

function sourceInitials(filename) {
  return filename.replace(/\.pdf$/i, '').split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
}

function appendWords(text) {
  for (const word of text.split(/\s+/)) {
    if (!word) continue;
    const span = document.createElement('span');
    span.className = 'w';
    span.textContent = word + ' ';
    answerBody.append(span);
  }
}

function appendCitation(n) {
  const chip = document.createElement('span');
  chip.className = 'cite-chip';
  chip.textContent = `[${n}]`;
  const src = sourcesList[n - 1];
  chip.title = src ? `${src.filename} p.${src.page}` : '';
  chip.onclick = () => scrollToSource(n);
  answerBody.append(chip);
}

function flushPending() {
  if (!pendingText || !answerBody) return;
  let processed = 0;
  const re = /\[(\d+)\]/g;
  let m;
  while ((m = re.exec(pendingText)) !== null) {
    appendWords(pendingText.slice(processed, m.index));
    appendCitation(parseInt(m[1], 10));
    processed = m.index + m[0].length;
  }
  const tail = pendingText.slice(processed);
  if (/\[\d*$/.test(tail)) {
    // Incomplete citation marker at the end — hold it for the next chunk.
    pendingText = tail;
    return;
  }
  appendWords(tail);
  pendingText = '';
}

function ensureAnswerEl() {
  if (answerEl) return;
  answerEl = addMsg('assistant');
  answerEl.classList.add('typing');
  answerBody = document.createElement('div');
  answerBody.className = 'answer-body';
  answerEl.append(answerBody);
  const cursor = document.createElement('span');
  cursor.className = 'stream-cursor';
  cursor.setAttribute('aria-hidden', 'true');
  answerBody.append(cursor);
}

function buildAnswerFooter() {
  if (sourcesList.length) {
    const wrap = document.createElement('div');
    wrap.className = 'sources-wrap';
    const panel = document.createElement('div');
    panel.className = 'sources-pop';
    panel.innerHTML = '<div class="sources-inner">' + sourcesList.map((s, i) =>
      `<div class="src-card" onclick="scrollToSource(${i + 1})" title="Click to scroll to citation">
        <span class="num">[${i + 1}]</span>
        <span class="fname">${esc(s.filename)}</span>
        <span class="page">p.${s.page}</span>
        <span class="score">${s.score.toFixed(2)}</span>
      </div>`
    ).join('') + '</div>';
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'src-toggle';
    toggle.innerHTML =
      `<span class="src-avatars">${sourcesList.slice(0, 4).map((s, i) => `<span class="src-avatar" style="background:${AVATAR_COLORS[i % AVATAR_COLORS.length]}">${esc(sourceInitials(s.filename))}</span>`).join('')}</span>` +
      `<span>${sourcesList.length} source${sourcesList.length > 1 ? 's' : ''}</span>`;
    toggle.addEventListener('click', () => panel.classList.toggle('open'));
    wrap.append(toggle, panel);
    chat.append(wrap);
  }

  const actions = document.createElement('div');
  actions.className = 'answer-actions';
  const makeAction = (label, svg) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'action-btn';
    b.title = label;
    b.setAttribute('aria-label', label);
    b.innerHTML = svg;
    actions.append(b);
    return b;
  };
  const copyBtn = makeAction('Copy', COPY_SVG);
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(markdownBuffer);
      copyBtn.innerHTML = '\u2713';
      setTimeout(() => { copyBtn.innerHTML = COPY_SVG; }, 1200);
    } catch {}
  });
  makeAction('Retry', RETRY_SVG).addEventListener('click', () => runAsk(lastQuestion));
  const upBtn = makeAction('Good answer', UP_SVG);
  upBtn.addEventListener('click', () => upBtn.classList.toggle('on'));
  const downBtn = makeAction('Bad answer', DOWN_SVG);
  downBtn.addEventListener('click', () => downBtn.classList.toggle('on'));
  chat.append(actions);

  const fu = document.createElement('div');
  fu.className = 'followups';
  const label = document.createElement('p');
  label.className = 'fu-label';
  label.textContent = 'Follow-ups';
  fu.append(label);
  ['Summarize the answer above', 'Explain this in simpler terms', 'What are the sources for this?'].forEach((text, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fu-btn';
    b.style.animationDelay = `${i * 90}ms`;
    b.innerHTML = ARROW_SVG + `<span>${esc(text)}</span>`;
    b.addEventListener('click', () => runAsk(text));
    fu.append(b);
  });
  chat.append(fu);
  fu.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function maybeAutoScroll() {
  // Follow the stream only if the user is already near the bottom —
  // never yank them down when they're reading older messages.
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
  if (nearBottom) chat.scrollTop = chat.scrollHeight;
}

async function runAsk(question) {
  const q = question.trim();
  if (!q) return;

  input.value = '';
  lastQuestion = q;
  addMsg('user').textContent = q;

  answerEl = null;
  answerBody = null;
  pendingText = '';
  markdownBuffer = '';
  sourcesList = [];
  statusEl = addStatus('Starting\u2026');
  send.disabled = true;

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));

        switch (data.type) {
          case 'status':
            if (statusEl) statusEl.remove();
            statusEl = addStatus(data.message);
            break;

          case 'sources':
            if (statusEl) { statusEl.classList.add('done'); statusEl.innerHTML = '\u2713 Found ' + data.sources.length + ' sources'; statusEl = null; }
            sourcesList = data.sources;
            break;

          case 'token':
            ensureAnswerEl();
            markdownBuffer += data.token;
            pendingText += data.token;
            flushPending();
            maybeAutoScroll();
            break;

          case 'metrics':
            if (statusEl) statusEl.remove();
            if (answerEl) answerEl.classList.remove('typing');
            if (window.marked && answerEl) {
              answerEl.innerHTML = linkCitations(marked.parse(markdownBuffer));
            }
            addMetrics(data);
            break;

          case 'error':
            addMsg('assistant').textContent = 'Error: ' + data.message;
            break;
        }
      }
    }

    // Stream finished: flush leftovers, render final markdown, show footer.
    flushPending();
    if (answerEl && answerBody) {
      answerEl.classList.remove('typing');
      const cursor = answerBody.querySelector('.stream-cursor');
      if (cursor) cursor.remove();
      if (window.marked) {
        answerBody.innerHTML = linkCitations(marked.parse(markdownBuffer));
      }
    }
    buildAnswerFooter();

  } catch (err) {
    addMsg('assistant').textContent = 'Connection error: ' + err.message;
  }

  send.disabled = false;
  input.focus();
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  runAsk(input.value);
});

// Initial sidebar load.
loadDocs();

// Link [N] citations to source cards
function linkCitations(html) {
  return html.replace(/\[(\d+)\]/g, (m, n) => {
    const src = sourcesList[parseInt(n) - 1];
    if (!src) return m;
    const fname = esc(src.filename);
    return `<a class="citation" href="#" onclick="scrollToSource(${n});return false" title="${fname} p.${src.page}">[${n}]</a>`;
  });
}

function scrollToSource(n) {
  const cards = document.querySelectorAll('.src-card');
  const card = cards[n - 1];
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.style.boxShadow = '0 0 0 2px var(--accent)';
    setTimeout(() => card.style.boxShadow = '', 1500);
  }
}
</script>
